name: Build bundles

# After each push to `main`, builds the generated board bundles and pushes them
# to `main` as the `plot-build` GitHub App. `GITHUB_TOKEN` cannot do this push:
# it starts no workflows and cannot bypass the `main` ruleset. The App's
# installation token does both, and the ruleset's bypass list holds the App.
#
# The decisions (generated set, loop guard, refused push) live in
# `scripts/main-bundles.sh`, which has a fixture test.

on:
  push:
    branches: [main]

# A run for an older push must not push an older build over a newer one.
concurrency:
  group: build-bundles
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.PLOT_BUILD_APP_ID }}
          private-key: ${{ secrets.PLOT_BUILD_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build and push the bundles
        run: |
          git config user.name 'plot-build[bot]'
          git config user.email 'plot-build[bot]@users.noreply.github.com'
          ./scripts/main-bundles.sh publish
