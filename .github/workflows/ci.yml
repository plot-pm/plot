name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    # A CEILING, not a target. GitHub's default is 360 minutes, which is not a
    # limit anyone waits for — a wedged step simply never returns, and the run
    # sits in `in_progress` looking like work. Measured 2026-08-19: eleven runs
    # hung on the Playwright download alone, 10 to 57 minutes each, every one
    # ended by hand. A green run takes about 7 minutes, so 25 leaves ample room
    # for a slow runner while turning a hang into a FAILURE — and a failure can
    # be re-run, while a hang has to be noticed first.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate skills parse
        run: pnpm test

      - name: Validate skill frontmatter
        run: pnpm run validate

      - name: Reconcile contract tests
        run: pnpm run test:reconcile
      - name: E2E choreography tests
        run: pnpm run test:e2e

      # ── Domain: the package the board now imports its entities from. Gated
      #    BEFORE the board, because the board resolves these shapes from here
      #    and a domain that does not hold cannot produce a meaningful board
      #    failure — it produces a confusing one. ────────────────────────────────

      # THE BOUNDARY, ENFORCED RATHER THAN DESCRIBED. The domain may import zod
      # and nothing that reaches the world. Empty output is the gate.
      #
      # `contract/schema.ts` passed this unmodified on the day it moved, which
      # is the evidence the boundary is real rather than aspirational. The
      # package resolver already refuses `../server/fleet.js`; this catches the
      # other direction — a module reaching a disk, a process or a network
      # directly.
      - name: Domain purity gate
        run: |
          hits=$(grep -rlE "from '(node:|fs|child_process|http|https|net)" packages/domain/src/ || true)
          if [ -n "$hits" ]; then
            echo "::error::the domain reached the world — it may import zod and nothing else:"
            echo "$hits"
            exit 1
          fi
          echo "Domain purity gate: clean."

      # THE SPEC'S VOCABULARY, ENFORCED. `DESIGN-slice.md` renamed this entity
      # Slice on 2026-08-28: a Slice holds one branch and belongs to one plan,
      # while a Wave is the fleet's cross-plan cohort and is persisted nowhere.
      # The code still says Wave where it means Slice — a known defect with its
      # own plan. This gate does not fix it; it stops it GROWING, by counting
      # and refusing an increase.
      #
      # A count rather than a ban, because the existing occurrences are exactly
      # what the rename plan removes. When it lands, this number goes to 0 and
      # the gate becomes a ban.
      # THE SPEC'S VOCABULARY, ENFORCED — and scoped to the MISUSE, not the word.
      #
      # `DESIGN-slice.md` renamed the per-plan entity **Slice** on 2026-08-28. It
      # also kept **Wave** as a real entity: the fleet's cross-plan cohort,
      # assembled at dispatch and persisted nowhere. So `Wave` is not a banned
      # word — it is a word with exactly one correct meaning.
      #
      # THE FIRST VERSION OF THIS GATE COUNTED EVERY `wave` AND WAS WRONG.
      # Measured 2026-08-29: a worker building the ten specified entities needed
      # to add the real `Wave`, which would have taken the count from 34 to 42
      # and failed the build. It renamed the entity to `Cohort` to get past the
      # gate — a word that appears NOWHERE in the spec. The gate had made the
      # correct name the expensive one, which is how a gate teaches evasion.
      #
      # So it counts the MISUSE: `Wave` bound to a per-plan shape — the
      # identifiers the rename plan removes — and ignores prose and the
      # standalone `Wave` entity.
      - name: Domain vocabulary gate
        run: |
          allowed=13  # measured 2026-08-29 on main; the rename plan drives it to 0
          found=$(grep -roE "FleetWave|WaveVerdict|\bwaves\b" packages/domain/src/ | wc -l | tr -d ' ')
          if [ "$found" -gt "$allowed" ]; then
            echo "::error::the domain gained $((found - allowed)) misuse(s) of Wave ($found > $allowed)."
            echo "A Slice holds one branch and belongs to one plan. A Wave is the fleet's"
            echo "cross-plan cohort — that entity keeps the name. See DESIGN-slice.md."
            grep -ronE "FleetWave|WaveVerdict|\bwaves\b" packages/domain/src/ | head -40
            exit 1
          fi
          echo "Domain vocabulary gate: $found misuse(s), none added."

      # THE ACTOR IS AN AGENT, and "worker" is only how a process sees it.
      # `DESIGN-agent.md`: *"A 'worker' is not a separate thing an Agent has —
      # it is the Agent, observed through the process table."* Specialised
      # agents that are not loop-workers must stay expressible, so the actor
      # keeps one name.
      #
      # SCOPED TO THE MISUSE, learned from the vocabulary gate above: its first
      # version counted a whole word, made the SPEC'S OWN name the expensive
      # one, and taught a worker to invent `Cohort` to get past it. So this
      # allows the two process-level names the spec keeps — `WorkerState*` (six
      # process-table observations plus two task states) and `WorkerActivity*`
      # (a CPU cue) — plus the `Worker command` / `Worker bound` config keys,
      # and refuses `Worker` as a name for the actor.
      - name: Domain actor-name gate
        run: |
          # Filter on the LINE, not on the matched word: `grep -o` discards the
          # context that tells `Worker command` apart from a bare `Worker`.
          hits=$(grep -rnE "\bWorker[A-Za-z]*" packages/domain/src/ \
                 | grep -vE "WorkerState|WorkerActivity" \
                 | grep -vE "\`?Worker (command|bound)\`?" || true)
          if [ -n "$hits" ]; then
            echo "::error::the actor is an Agent — 'Worker' names the process, never the actor:"
            echo "$hits"
            echo "Allowed: WorkerState*, WorkerActivity*, and the Worker command/bound config keys."
            exit 1
          fi
          echo "Domain actor-name gate: clean."

      # ARROW FUNCTIONS, per CLAUDE.md > The Domain Package. The board's 507
      # `function` declarations are deliberately not the model — this rule is
      # for new code only, so it is scoped to this package.
      - name: Domain function-style gate
        run: |
          hits=$(grep -rnE "^\s*(export )?function " packages/domain/src/ || true)
          if [ -n "$hits" ]; then
            echo "::error::the domain package uses arrow functions — 'export const f = (…) => …':"
            echo "$hits"
            exit 1
          fi
          echo "Domain function-style gate: clean."

      - name: Domain typecheck
        run: pnpm --filter @plot-pm/domain typecheck

      # A GATE, NOT A REPORT: `thresholds` makes this exit non-zero below 100%.
      # Defensible in this package and nowhere else here — the purity boundary
      # guarantees every line is reachable from a plain function call, so an
      # uncovered line is a line nobody specified.
      - name: Domain tests + coverage gate
        run: pnpm --filter @plot-pm/domain exec vitest run --coverage

      # ── Board (first-class): the Definition of Done requires the board to keep
      #    working. Typecheck, tests, and a fresh build are gated here. ──────────
      - name: Board typecheck
        run: pnpm run typecheck

      - name: Board build + artifact freshness
        run: |
          pnpm run build:board
          if ! git diff --quiet -- skills/plot/scripts/board/board-server.mjs; then
            echo "::error::skills/plot/scripts/board/board-server.mjs is stale — run 'pnpm build:board' and commit the result."
            git --no-pager diff --stat -- skills/plot/scripts/board/board-server.mjs
            exit 1
          fi
          echo "Board artifact is fresh."

      - name: Board tests
        run: pnpm --filter @plot-pm/board test

      # ── Board integration tests: a real browser (Playwright) renders the just-
      #    built artifact against the tiny-garden fixture, asserting the mobile
      #    no-horizontal-scroll fix and the inline-sprint filter. ───────────────
      # THE STEP THAT HUNG ELEVEN TIMES IN ONE DAY, and neither half of this is
      # optional. The cache usually removes the download entirely; the timeout
      # decides what happens on the days it does not.
      #
      # Keyed on the resolved Playwright version rather than on the lockfile
      # hash: the browser build is chosen by that version and by nothing else,
      # so a lockfile change elsewhere must not evict a browser that is still
      # correct. `restore-keys` lets a near-miss serve the OS deps while the
      # exact browser is fetched.
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/board/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # THREE MINUTES, against a step that takes ~45 s warm and ~90 s cold.
      # This is deliberately tight: the failure mode is not a slow CDN, it is a
      # connection that never completes, and every measured hang sat past 10
      # minutes with no output. A tight bound turns that into a fast, re-runnable
      # failure instead of an hour of silence — the difference between a gate and
      # a thing somebody has to watch.
      - name: Install Playwright browser
        timeout-minutes: 3
        run: pnpm --filter @plot-pm/board exec playwright install --with-deps chromium

      # The longest legitimate step — a real browser against the built artifact.
      # Measured green at 4 to 8 minutes; 15 covers a saturated runner without
      # letting a wedged browser hold the job to the ceiling above.
      - name: Board integration tests (vitest + Playwright)
        timeout-minutes: 15
        run: pnpm --filter @plot-pm/board exec vitest run

      # NOT gated on pull_request: an unknown package name aborts `changeset
      # version` for the WHOLE repo, so it must fail on main too — the four-day
      # silent freeze of the v2.9.0 release PR is what this exists to prevent,
      # and that PR was never itself a pull_request event on these files.
      - name: Changesets name real workspace packages
        run: ./scripts/check-changeset-packages.sh

      - name: Check for changeset
        if: github.event_name == 'pull_request'
        run: |
          # Find pending changeset files (not README.md or _template)
          changeset_files=$(find .changeset -name '*.md' -not -name 'README.md' -not -name '_template' 2>/dev/null || true)

          if [ -z "$changeset_files" ]; then
            echo "::warning::No changeset found. If this PR changes skills, run 'pnpm changeset' to add one."
            exit 0
          fi

          echo "Found changesets:"
          echo "$changeset_files"

          # Validate that bumps: block references existing skill directories
          echo "$changeset_files" | while IFS= read -r f; do
            [ -z "$f" ] && continue

            # Extract skill names from <!-- bumps: skills: skill-name: bump --> block
            awk '/^<!--/{c=1;next}/^-->/{c=0;next}c' "$f" | \
              awk '/skills:/{s=1;next} /^[[:space:]]{0,2}[a-z]/{s=0} s && /[a-z]/' | \
              sed 's/^[[:space:]]*//;s/[[:space:]]*:.*//' | \
            while IFS= read -r skill; do
              [ -z "$skill" ] && continue
              if [ ! -d "skills/$skill" ]; then
                echo "::error file=$f::bumps block references non-existent skill directory: '$skill'"
                exit 1
              fi
            done
          done

          echo "All changeset bumps references are valid."
