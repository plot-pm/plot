name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ── The corpus tier: do the adapters feed the domain the same readings
  #    production reads, against this repository's real estate? ───────────────
  #
  # ITS OWN JOB, PARALLEL TO `validate`, AND THE SEPARATION IS THE POINT.
  #
  # Cost is half the argument: this runs `plot-fleet-scan.sh` twice — once as
  # production, once through the adapter — and `plot-plan-meta.sh` over every
  # plan in `docs/plans/`. Measured 2026-08-30 on this estate: 42 s for the
  # suite, of which ~40 s is the two scans. `validate` already carries a
  # 15-minute browser step inside a 25-minute ceiling and its board integration
  # suite ran 12.5 minutes on 2026-08-29 and has timed out at 15. Adding work to
  # a job at its budget makes a suite fail for reasons unrelated to the code
  # under test.
  #
  # THE OTHER HALF IS THAT THE TWO SIGNALS MEAN DIFFERENT THINGS. A red
  # `validate` means the board. A red `corpus` means the adapters and production
  # disagree about what this repository says — and that finding is only legible
  # if it cannot be produced by anything else in the job.
  #
  # PER PR RATHER THAN NIGHTLY, because "a disagreement fails CI" is only a gate
  # if the failure lands on the change that caused it. Found hours later it is a
  # report, and a report is something someone has to remember to read.
  #
  # ON A RED CORPUS JOB, DO NOT ADJUST THE ADAPTER TO MATCH. Which side is wrong
  # is judgement: the adapter may be wrong, or this may have found a production
  # bug that gets its own plan. The failure prints the field, the plan and both
  # readings so a person can decide. Adjusting the adapter is the permissive
  # failure — it cements a real production bug behind a passing test.
  corpus:
    runs-on: ubuntu-latest
    # Generous against the measured 42 s, and still a bound: a wedged fleet scan
    # becomes a re-runnable failure rather than a job that sits in `in_progress`
    # looking like work — the lesson `validate`'s own ceiling records.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # THE SCAN READS REFS, so a depth-1 clone gives it nothing to read.
          # The Reading slice already met this: two of its `Refs` tests had to
          # be rewritten to assert shape rather than values, because
          # `actions/checkout` clones one ref and there is no branch list and no
          # `origin/HEAD`. This tier compares VALUES over the real estate, so it
          # needs the history that estate lives in.
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The scan derives from `origin/<main>` rather than from the working tree
      # — an approval nobody else can see is not one — so the ref has to exist
      # locally. On a PR checkout it does not.
      - name: Fetch the default branch the scan reads
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Corpus tier — adapters vs production
        timeout-minutes: 10
        run: pnpm --filter @plot-pm/domain run test:corpus

  validate:
    runs-on: ubuntu-latest
    # A CEILING, not a target. GitHub's default is 360 minutes, which is not a
    # limit anyone waits for — a wedged step simply never returns, and the run
    # sits in `in_progress` looking like work. Measured 2026-08-19: eleven runs
    # hung on the Playwright download alone, 10 to 57 minutes each, every one
    # ended by hand. A green run takes about 7 minutes, so 25 leaves ample room
    # for a slow runner while turning a hang into a FAILURE — and a failure can
    # be re-run, while a hang has to be noticed first.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate skills parse
        run: pnpm test

      - name: Validate skill frontmatter
        run: pnpm run validate

      # A CEILING AND A WITNESS, because the failure this catches reports NOTHING.
      #
      # Measured 2026-08-30/31: 10 of 16 observed runs cancelled here, at ~25
      # minutes, with no step marked `failure` and `--log-failed` empty. The
      # suite passes 912/912 locally in ~7 min on the same commit, so the cause
      # is not in the assertions and has survived eight eliminations.
      #
      # `--test-reporter=tap` is the load-bearing half: node's default reporter
      # buffers, so when the job is killed its output dies with it. TAP streams,
      # so the last line before silence NAMES the file that wedged.
      - name: Reconcile contract tests
        timeout-minutes: 12
        run: pnpm run test:reconcile
      - name: What was still running (only when the suite wedged)
        if: failure()
        run: |
          echo "=== processes ==="
          ps -eo pid,ppid,etime,stat,args | grep -E '[n]ode|[b]ash|[s]leep|[g]it' | head -50 || true
          echo "=== worker logs left behind ==="
          find "${TMPDIR:-/tmp}" -name '.plot-worker*.log' -mmin -30 2>/dev/null | head -20 | while read -r f; do
            echo "--- $f"; tail -30 "$f" || true
          done
          echo "=== fixture directories ==="
          ls -dt "${TMPDIR:-/tmp}"/plot-* 2>/dev/null | head -20 || true
      # BOUNDED like its neighbours. The reconcile step above carries
      # `timeout-minutes: 12` because it once wedged until the job ceiling at 25
      # and reported nothing; this step had no bound at all. E2E dispatches real
      # workers, so it is the likeliest of all of them to hang — and now that it
      # is CI's gate rather than a local one, a hang here is the only place the
      # failure can surface.
      - name: E2E choreography tests
        timeout-minutes: 15
        run: pnpm run test:e2e

      # ── Domain: the package the board now imports its entities from. Gated
      #    BEFORE the board, because the board resolves these shapes from here
      #    and a domain that does not hold cannot produce a meaningful board
      #    failure — it produces a confusing one. ────────────────────────────────

      # THE BOUNDARY, ENFORCED RATHER THAN DESCRIBED. The domain may import zod
      # and nothing that reaches the world. Empty output is the gate.
      #
      # `contract/schema.ts` passed this unmodified on the day it moved, which
      # is the evidence the boundary is real rather than aspirational. The
      # package resolver already refuses `../server/fleet.js`; this catches the
      # other direction — a module reaching a disk, a process or a network
      # directly.
      # `adapters/` IS EXCLUDED, and that exclusion is the layer boundary made
      # mechanical rather than a hole in the gate. An adapter's whole job is to
      # reach the world; what the gate now asserts is that every module which
      # does so lives in exactly ONE directory. Empty output still means the
      # domain is pure — the completeness gate below is what stops that
      # directory from being a place to put anything.
      - name: Domain purity gate
        run: |
          hits=$(grep -rlE "from '(node:|fs|child_process|http|https|net)" packages/domain/src/ \
                 | grep -v '^packages/domain/src/adapters/' || true)
          if [ -n "$hits" ]; then
            echo "::error::the domain reached the world — outside adapters/ it may import zod and nothing else:"
            echo "$hits"
            exit 1
          fi
          echo "Domain purity gate: clean."

      # THE OTHER HALF OF THE LAYER, and the half that was never enforced.
      #
      # The purity gate above stops the DOMAIN importing the world. Nothing
      # stopped the BOARD reaching past the port — measured 2026-08-30, CI had
      # zero path references to `packages/board/src` at all, while that tree
      # held dozens of direct `spawn`/`execFile` calls.
      #
      # A RATCHET, NOT A REFUSAL, because 54 call sites cannot be fixed in one
      # branch. It fails when the number GROWS and never when it falls, so the
      # migration lowers `allowed` slice by slice and nothing silently adds a
      # new one alongside. The target is zero and is stated here so a reader
      # knows the number is a debt, not a budget.
      #
      # `allowed` IS A LITERAL ON PURPOSE. Deriving it from the estate would
      # make the gate agree with whatever it found, which is a check you can
      # answer "yes" to without doing the work. Raising it costs a visible line
      # in a diff, and that line is the decision.
      #
      # The count moved 65 -> 54 between this slice being written and being
      # built, entirely through `production-calls` and `the-read-path` work.
      # The gate records the migration; it does not perform it.
      - name: One place reaches a process
        run: |
          allowed=54
          hits=$(grep -rEn '^[^*/]*\b(spawn|spawnSync|execFile|execFileSync)\s*\(' \
                   --include='*.ts' packages/board/src packages/domain/src \
                 | grep -v '/adapters/' || true)
          count=$(printf '%s' "$hits" | grep -c . || true)
          echo "direct spawns outside adapters/: $count (allowed $allowed, target 0)"
          if [ "$count" -gt "$allowed" ]; then
            echo "::error::a new direct spawn crossed the layer — $count sites, allowed $allowed."
            echo "Every process call belongs behind a port. The sites:"
            printf '%s\n' "$hits"
            exit 1
          fi
          if [ "$count" -lt "$allowed" ]; then
            echo "::notice::the ratchet can tighten — $count sites, allowed still $allowed."
          fi

      # TWO-SIDED, BECAUSE ONE SIDE PASSES ON NOTHING.
      #
      # "Every ports/*.ts has a directory under adapters/" is a universal claim,
      # and a universal claim over an empty set is true. Measured 2026-08-30:
      # there was no ports/ directory at all, so that assertion alone would have
      # reported success before a line was written — a check you can answer
      # "yes" to without doing the work is a rule, not a gate.
      #
      # So it also asserts a FLOOR. Seven is the port count DESIGN-ports.md §2
      # derives from the four sources of state; a port removed is a design
      # change that should have to edit this number.
      - name: Domain port completeness gate
        run: |
          ports=$(ls packages/domain/src/ports/*.ts 2>/dev/null | wc -l | tr -d ' ')
          if [ "$ports" -lt 7 ]; then
            echo "::error::expected at least 7 ports, found $ports."
            echo "The seven are PlanStore, Refs, Host, Processes, Trees, Clock, Machine —"
            echo "one per source of truth the domain may not look at. See DESIGN-ports.md."
            exit 1
          fi
          missing=""
          for port in packages/domain/src/ports/*.ts; do
            name=$(basename "$port" .ts)
            [ -d "packages/domain/src/adapters/$name" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::a port was declared and never implemented:$missing"
            echo "Every ports/<name>.ts needs a directory adapters/<name>/."
            exit 1
          fi
          echo "Domain port completeness gate: $ports ports, each with an adapter."

      # THE SPEC'S VOCABULARY, ENFORCED. `DESIGN-slice.md` renamed this entity
      # Slice on 2026-08-28: a Slice holds one branch and belongs to one plan,
      # while a Wave is the fleet's cross-plan cohort and is persisted nowhere.
      # The entity is renamed: no identifier here is named Wave. What remains is
      # the wire-compatibility path — `plot-fleet-scan.sh` still emits `waves`,
      # and the scan is a separate process that ships separately — plus the
      # comment that reserves the name for the cohort entity when the fleet
      # learns to form one.
      #
      # THE SPEC'S VOCABULARY, ENFORCED — and scoped to the MISUSE, not the word.
      #
      # `DESIGN-slice.md` renamed the per-plan entity **Slice** on 2026-08-28. It
      # also kept **Wave** as a real entity: the fleet's cross-plan cohort,
      # assembled at dispatch and persisted nowhere. So `Wave` is not a banned
      # word — it is a word with exactly one correct meaning.
      #
      # THE FIRST VERSION OF THIS GATE COUNTED EVERY `wave` AND WAS WRONG.
      # Measured 2026-08-29: a worker building the ten specified entities needed
      # to add the real `Wave`, which would have taken the count from 34 to 42
      # and failed the build. It renamed the entity to `Cohort` to get past the
      # gate — a word that appears NOWHERE in the spec. The gate had made the
      # correct name the expensive one, which is how a gate teaches evasion.
      #
      # So it counts the MISUSE: `Wave` bound to a per-plan shape — the
      # identifiers the rename plan removes — and ignores prose and the
      # standalone `Wave` entity.
      - name: Domain vocabulary gate
        run: |
          allowed=10  # 2026-08-29: the entity rename took it 12 -> 10; the target is 0
          # A QUOTED WIRE KEY IS NOT A MISUSE. `plot-plan-meta.sh` and
          # `plot-fleet-scan.sh` ship separately from this package and still
          # emit `waves`, so an adapter reading them must name that key once —
          # and the name belongs to the FOREIGN process, not to any shape here.
          # Excluded by the quoting, so `'waves'` passes and a bare `waves`
          # identifier does not. Without this the gate makes reading the estate
          # the expensive act, which is the evasion its own history warns about:
          # a worker met by it renamed the correct entity to `Cohort` to get past.
          #
          # FILTERED ON THE LINE, NOT THE MATCHED WORD — the lesson the actor-name
          # gate below already records. `grep -o` prints the word alone, which
          # discards the quotes that tell a wire key from an identifier.
          found=$(grep -rnE "FleetWave|WaveVerdict|\bwaves\b" packages/domain/src/ \
                  | grep -vE "=\s*'waves'" | wc -l | tr -d ' ')
          if [ "$found" -gt "$allowed" ]; then
            echo "::error::the domain gained $((found - allowed)) misuse(s) of Wave ($found > $allowed)."
            echo "A Slice holds one branch and belongs to one plan. A Wave is the fleet's"
            echo "cross-plan cohort — that entity keeps the name. See DESIGN-slice.md."
            grep -rnE "FleetWave|WaveVerdict|\bwaves\b" packages/domain/src/ \
              | grep -vE "=\s*'waves'" | head -40
            exit 1
          fi
          echo "Domain vocabulary gate: $found misuse(s), none added."

      # THE ACTOR IS AN AGENT, and "worker" is only how a process sees it.
      # `DESIGN-agent.md`: *"A 'worker' is not a separate thing an Agent has —
      # it is the Agent, observed through the process table."* Specialised
      # agents that are not loop-workers must stay expressible, so the actor
      # keeps one name.
      #
      # SCOPED TO THE MISUSE, learned from the vocabulary gate above: its first
      # version counted a whole word, made the SPEC'S OWN name the expensive
      # one, and taught a worker to invent `Cohort` to get past it. So this
      # allows the two process-level names the spec keeps — `WorkerState*` (six
      # process-table observations plus two task states) and `WorkerActivity*`
      # (a CPU cue) — plus the `Worker command` / `Worker bound` config keys,
      # and refuses `Worker` as a name for the actor.
      - name: Domain actor-name gate
        run: |
          # Filter on the LINE, not on the matched word: `grep -o` discards the
          # context that tells `Worker command` apart from a bare `Worker`.
          hits=$(grep -rnE "\bWorker[A-Za-z]*" packages/domain/src/ \
                 | grep -vE "WorkerState|WorkerActivity" \
                 | grep -vE "\`?Worker (command|bound)\`?" || true)
          if [ -n "$hits" ]; then
            echo "::error::the actor is an Agent — 'Worker' names the process, never the actor:"
            echo "$hits"
            echo "Allowed: WorkerState*, WorkerActivity*, and the Worker command/bound config keys."
            exit 1
          fi
          echo "Domain actor-name gate: clean."

      # ARROW FUNCTIONS, per CLAUDE.md > The Domain Package. The board's 507
      # `function` declarations are deliberately not the model — this rule is
      # for new code only, so it is scoped to this package.
      - name: Domain function-style gate
        run: |
          hits=$(grep -rnE "^\s*(export )?function " packages/domain/src/ || true)
          if [ -n "$hits" ]; then
            echo "::error::the domain package uses arrow functions — 'export const f = (…) => …':"
            echo "$hits"
            exit 1
          fi
          echo "Domain function-style gate: clean."

      - name: Domain typecheck
        run: pnpm --filter @plot-pm/domain typecheck

      # A GATE, NOT A REPORT: `thresholds` makes this exit non-zero below 100%.
      # Defensible in this package and nowhere else here — the purity boundary
      # guarantees every line is reachable from a plain function call, so an
      # uncovered line is a line nobody specified.
      - name: Domain tests + coverage gate
        timeout-minutes: 10
        run: pnpm --filter @plot-pm/domain exec vitest run --coverage

      # ── Board (first-class): the Definition of Done requires the board to keep
      #    working. Typecheck, tests, and a fresh build are gated here. ──────────
      - name: Board typecheck
        run: pnpm run typecheck

      - name: Board build + artifact freshness
        timeout-minutes: 10
        run: |
          pnpm run build:board
          if ! git diff --quiet -- skills/plot/scripts/board/board-server.mjs; then
            echo "::error::skills/plot/scripts/board/board-server.mjs is stale — run 'pnpm build:board' and commit the result."
            git --no-pager diff --stat -- skills/plot/scripts/board/board-server.mjs
            exit 1
          fi
          echo "Board artifact is fresh."

      # BOUNDED BECAUSE IT SPAWNS. This runs the board's `node --test` suites,
      # which start real `board-server.mjs` processes — the population that hung
      # locally on 2026-08-31 (two runs asleep at 0% CPU for 33 and 47 minutes,
      # holding an orphaned server). A step that spawns can hang; a grep cannot,
      # which is why the gates below carry no bound and this does.
      - name: Board tests
        timeout-minutes: 10
        run: pnpm --filter @plot-pm/board test

      # ── Board integration tests: a real browser (Playwright) renders the just-
      #    built artifact against the tiny-garden fixture, asserting the mobile
      #    no-horizontal-scroll fix and the inline-sprint filter. ───────────────
      # THE STEP THAT HUNG ELEVEN TIMES IN ONE DAY, and neither half of this is
      # optional. The cache usually removes the download entirely; the timeout
      # decides what happens on the days it does not.
      #
      # Keyed on the resolved Playwright version rather than on the lockfile
      # hash: the browser build is chosen by that version and by nothing else,
      # so a lockfile change elsewhere must not evict a browser that is still
      # correct. `restore-keys` lets a near-miss serve the OS deps while the
      # exact browser is fetched.
      - name: Cache the Playwright browser
        timeout-minutes: 10
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/board/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # THREE MINUTES, against a step that takes ~45 s warm and ~90 s cold.
      # This is deliberately tight: the failure mode is not a slow CDN, it is a
      # connection that never completes, and every measured hang sat past 10
      # minutes with no output. A tight bound turns that into a fast, re-runnable
      # failure instead of an hour of silence — the difference between a gate and
      # a thing somebody has to watch.
      - name: Install Playwright browser
        timeout-minutes: 3
        run: pnpm --filter @plot-pm/board exec playwright install --with-deps chromium

      # The longest legitimate step — a real browser against the built artifact.
      # Measured green at 4 to 8 minutes; 15 covers a saturated runner without
      # letting a wedged browser hold the job to the ceiling above.
      - name: Board integration tests (vitest + Playwright)
        timeout-minutes: 15
        run: pnpm --filter @plot-pm/board exec vitest run

      # NOT gated on pull_request: an unknown package name aborts `changeset
      # version` for the WHOLE repo, so it must fail on main too — the four-day
      # silent freeze of the v2.9.0 release PR is what this exists to prevent,
      # and that PR was never itself a pull_request event on these files.
      - name: Changesets name real workspace packages
        run: ./scripts/check-changeset-packages.sh

      - name: Check for changeset
        if: github.event_name == 'pull_request'
        run: |
          # Find pending changeset files (not README.md or _template)
          changeset_files=$(find .changeset -name '*.md' -not -name 'README.md' -not -name '_template' 2>/dev/null || true)

          if [ -z "$changeset_files" ]; then
            echo "::warning::No changeset found. If this PR changes skills, run 'pnpm changeset' to add one."
            exit 0
          fi

          echo "Found changesets:"
          echo "$changeset_files"

          # Validate that bumps: block references existing skill directories
          echo "$changeset_files" | while IFS= read -r f; do
            [ -z "$f" ] && continue

            # Extract skill names from <!-- bumps: skills: skill-name: bump --> block
            awk '/^<!--/{c=1;next}/^-->/{c=0;next}c' "$f" | \
              awk '/skills:/{s=1;next} /^[[:space:]]{0,2}[a-z]/{s=0} s && /[a-z]/' | \
              sed 's/^[[:space:]]*//;s/[[:space:]]*:.*//' | \
            while IFS= read -r skill; do
              [ -z "$skill" ] && continue
              if [ ! -d "skills/$skill" ]; then
                echo "::error file=$f::bumps block references non-existent skill directory: '$skill'"
                exit 1
              fi
            done
          done

          echo "All changeset bumps references are valid."
