name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ── The corpus tier: do the adapters feed the domain the same readings
  #    production reads, against this repository's real estate? ───────────────
  #
  # ITS OWN JOB, PARALLEL TO `validate`, AND THE SEPARATION IS THE POINT.
  #
  # Cost is half the argument: this runs `plot-fleet-scan.sh` twice — once as
  # production, once through the adapter — and `plot-plan-meta.sh` over every
  # plan in `docs/plans/`. Measured 2026-08-30 on this estate: 42 s for the
  # suite, of which ~40 s is the two scans. `validate` already carries a
  # 15-minute browser step inside a 25-minute ceiling and its board integration
  # suite ran 12.5 minutes on 2026-08-29 and has timed out at 15. Adding work to
  # a job at its budget makes a suite fail for reasons unrelated to the code
  # under test.
  #
  # THE OTHER HALF IS THAT THE TWO SIGNALS MEAN DIFFERENT THINGS. A red
  # `validate` means the board. A red `corpus` means the adapters and production
  # disagree about what this repository says — and that finding is only legible
  # if it cannot be produced by anything else in the job.
  #
  # PER PR RATHER THAN NIGHTLY, because "a disagreement fails CI" is only a gate
  # if the failure lands on the change that caused it. Found hours later it is a
  # report, and a report is something someone has to remember to read.
  #
  # ON A RED CORPUS JOB, DO NOT ADJUST THE ADAPTER TO MATCH. Which side is wrong
  # is judgement: the adapter may be wrong, or this may have found a production
  # bug that gets its own plan. The failure prints the field, the plan and both
  # readings so a person can decide. Adjusting the adapter is the permissive
  # failure — it cements a real production bug behind a passing test.
  corpus:
    runs-on: ubuntu-latest
    # Generous against the measured 42 s, and still a bound: a wedged fleet scan
    # becomes a re-runnable failure rather than a job that sits in `in_progress`
    # looking like work — the lesson `validate`'s own ceiling records.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # THE SCAN READS REFS, so a depth-1 clone gives it nothing to read.
          # The Reading slice already met this: two of its `Refs` tests had to
          # be rewritten to assert shape rather than values, because
          # `actions/checkout` clones one ref and there is no branch list and no
          # `origin/HEAD`. This tier compares VALUES over the real estate, so it
          # needs the history that estate lives in.
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The scan derives from `origin/<main>` rather than from the working tree
      # — an approval nobody else can see is not one — so the ref has to exist
      # locally. On a PR checkout it does not.
      - name: Fetch the default branch the scan reads
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Corpus tier — adapters vs production
        timeout-minutes: 10
        run: pnpm --filter @plot-pm/domain run test:corpus

  validate:
    runs-on: ubuntu-latest
    # A CEILING, not a target. GitHub's default is 360 minutes, which is not a
    # limit anyone waits for — a wedged step simply never returns, and the run
    # sits in `in_progress` looking like work. Measured 2026-08-19: eleven runs
    # hung on the Playwright download alone, 10 to 57 minutes each, every one
    # ended by hand. A green run takes about 7 minutes, so 25 leaves ample room
    # for a slow runner while turning a hang into a FAILURE — and a failure can
    # be re-run, while a hang has to be noticed first.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate skills parse
        run: pnpm test

      - name: Validate skill frontmatter
        run: pnpm run validate

      # A CEILING AND A WITNESS, because the failure this catches reports NOTHING.
      #
      # Measured 2026-08-30/31: 10 of 16 observed runs cancelled here, at ~25
      # minutes, with no step marked `failure` and `--log-failed` empty. The
      # suite passes 912/912 locally in ~7 min on the same commit, so the cause
      # is not in the assertions and has survived eight eliminations.
      #
      # `--test-reporter=tap` is the load-bearing half: node's default reporter
      # buffers, so when the job is killed its output dies with it. TAP streams,
      # so the last line before silence NAMES the file that wedged.
      - name: Reconcile contract tests
        timeout-minutes: 12
        run: pnpm run test:reconcile
      - name: What was still running (only when the suite wedged)
        if: failure()
        run: |
          echo "=== processes ==="
          ps -eo pid,ppid,etime,stat,args | grep -E '[n]ode|[b]ash|[s]leep|[g]it' | head -50 || true
          echo "=== worker logs left behind ==="
          find "${TMPDIR:-/tmp}" -name '.plot-worker*.log' -mmin -30 2>/dev/null | head -20 | while read -r f; do
            echo "--- $f"; tail -30 "$f" || true
          done
          echo "=== fixture directories ==="
          ls -dt "${TMPDIR:-/tmp}"/plot-* 2>/dev/null | head -20 || true
      # BOUNDED like its neighbours. The reconcile step above carries
      # `timeout-minutes: 12` because it once wedged until the job ceiling at 25
      # and reported nothing; this step had no bound at all. E2E dispatches real
      # workers, so it is the likeliest of all of them to hang — and now that it
      # is CI's gate rather than a local one, a hang here is the only place the
      # failure can surface.
      - name: E2E choreography tests
        timeout-minutes: 15
        run: pnpm run test:e2e

      # THE SUPERVISOR'S UNIT, LOADED FOR REAL — the one arm of `/plot-fleet
      # --start` that CI can actually exercise.
      #
      # This runner is `ubuntu-latest`, so the launchd path can NEVER run here,
      # and that is the path a macOS operator uses. `fleetctl.test.mjs` asserts
      # both units fill and parse, which is a real failing check on Linux; what
      # it cannot assert is that systemd ACCEPTS the filled unit. `systemd-analyze
      # verify` does, and it needs no session bus and starts nothing.
      #
      # A DIRECTIVE SYSTEMD REJECTS IS A DAEMON THAT NEVER STARTS, and the
      # failure arrives as a unit sitting in `failed` on somebody's machine —
      # exactly the silent shape the four refusals exist to prevent. Loading the
      # plist for real stays a manual step, named as such in the release test
      # list, because there is no macOS runner in this workflow.
      - name: The systemd unit is one systemd accepts
        run: |
          mkdir -p ~/.config/systemd/user
          sed -e "s|__REPO_ROOT__|$PWD|g" \
              -e "s|__NODE__|$(command -v node)|g" \
              -e "s|__REGISTRYD__|$PWD/skills/plot/scripts/board/plot-registryd.mjs|g" \
              skills/plot/units/plot-registryd.service \
              > ~/.config/systemd/user/plot-registryd.service
          left=$(grep -c '__[A-Z_]*__' ~/.config/systemd/user/plot-registryd.service || true)
          if [ "$left" != "0" ]; then
            echo "::error::$left placeholder(s) survived the fill"
            grep -n '__[A-Z_]*__' ~/.config/systemd/user/plot-registryd.service
            exit 1
          fi
          systemd-analyze --user verify ~/.config/systemd/user/plot-registryd.service
          echo "The systemd unit verifies."

      # ── Domain: the package the board now imports its entities from. Gated
      #    BEFORE the board, because the board resolves these shapes from here
      #    and a domain that does not hold cannot produce a meaningful board
      #    failure — it produces a confusing one. ────────────────────────────────

      # THE BOUNDARY, ENFORCED RATHER THAN DESCRIBED. The domain may import zod
      # and nothing that reaches the world. Empty output is the gate.
      #
      # `contract/schema.ts` passed this unmodified on the day it moved, which
      # is the evidence the boundary is real rather than aspirational. The
      # package resolver already refuses `../server/fleet.js`; this catches the
      # other direction — a module reaching a disk, a process or a network
      # directly.
      # `adapters/` IS EXCLUDED, and that exclusion is the layer boundary made
      # mechanical rather than a hole in the gate. An adapter's whole job is to
      # reach the world; what the gate now asserts is that every module which
      # does so lives in exactly ONE directory. Empty output still means the
      # domain is pure — the completeness gate below is what stops that
      # directory from being a place to put anything.
      - name: Domain purity gate
        run: |
          hits=$(grep -rlaE "from '(node:|fs|child_process|http|https|net)" packages/domain/src/ \
                 | grep -v '^packages/domain/src/adapters/' || true)
          if [ -n "$hits" ]; then
            echo "::error::the domain reached the world — outside adapters/ it may import zod and nothing else:"
            echo "$hits"
            exit 1
          fi
          echo "Domain purity gate: clean."

      # THE CONNECTOR BOUNDARY, ENFORCED THE SAME WAY. The purity gate above
      # asserts the domain reaches nothing; this one asserts it KNOWS nothing —
      # no vendor name in domain code outside `adapters/`.
      #
      # It is what turns "adding a connector is an adapter change" from prose
      # into a property. `ports/host.ts` declared `HostBackend = 'github' |
      # 'bitbucket'` until 2026-09-01, so a third connector needed a domain
      # edit while every sentence in the file said it did not. A union is one
      # line, and the next one arrives the same way unless something refuses it.
      #
      # IT STRIPS COMMENTS FIRST, and that is the gate being about behaviour
      # rather than about text. Measured on this tree: 24 vendor mentions
      # outside `adapters/`, every one of them in a TSDoc block, and every one
      # an ARGUMENT FOR the property — `limit.ts:50` names GitHub's
      # `X-RateLimit-Resource` to explain why the bucket is unvalidated. A gate
      # matching those would force the explanations out and leave the union it
      # exists to catch, because a union carries no vendor word in a comment.
      #
      # The list is the vendors Plot has an opinion about plus the ones nearest
      # to arriving. It is not exhaustive and cannot be — a gate on every host
      # that exists is a gate on a word list nobody maintains. What it catches
      # is the shape that actually happened: a domain type or branch naming the
      # hosts Plot drives today.
      - name: The domain names no vendor
        run: |
          hits=$(grep -rEn --include='*.ts' -i \
                   '\b(github|bitbucket|gitlab|jenkins|jira|gitea|trello|linear)\b' \
                   packages/domain/src/ \
                 | grep -v '^packages/domain/src/adapters/' \
                 | grep -vE ':[[:space:]]*(\*|//|/\*)' || true)
          if [ -n "$hits" ]; then
            echo "::error::the domain named a vendor — a connector belongs in packages/domain/src/adapters/:"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "The domain names no vendor: clean."

      # THE OTHER HALF OF THE LAYER, and the half that was never enforced.
      #
      # The purity gate above stops the DOMAIN importing the world. Nothing
      # stopped the BOARD reaching past the port — measured 2026-08-30, CI had
      # zero path references to `packages/board/src` at all, while that tree
      # held dozens of direct `spawn`/`execFile` calls.
      #
      # A RATCHET, NOT A REFUSAL, because 54 call sites cannot be fixed in one
      # branch. It fails when the number GROWS and never when it falls, so the
      # migration lowers `allowed` slice by slice and nothing silently adds a
      # new one alongside. The target is zero and is stated here so a reader
      # knows the number is a debt, not a budget.
      #
      # `allowed` IS A LITERAL ON PURPOSE. Deriving it from the estate would
      # make the gate agree with whatever it found, which is a check you can
      # answer "yes" to without doing the work. Raising it costs a visible line
      # in a diff, and that line is the decision.
      #
      # The count moved 65 -> 54 between this slice being written and being
      # built, entirely through `production-calls` and `the-read-path` work,
      # then 54 -> 28 when `one-place-reaches-a-script` moved every `plot-*.sh`
      # invocation behind the `Scripts` port. What is left is `git`, `ps`, one
      # `tailscale`, and the `sh -c` starts for a project's configured command —
      # different tools reached through different contracts, and the next slice's
      # scope. The gate records the migration; it does not perform it.
      - name: One place reaches a process
        run: |
          allowed=28
          hits=$(grep -rEn '^[^*/]*\b(spawn|spawnSync|execFile|execFileSync)\s*\(' \
                   --include='*.ts' packages/board/src packages/domain/src \
                 | grep -v '/adapters/' || true)
          count=$(printf '%s' "$hits" | grep -c . || true)
          echo "direct spawns outside adapters/: $count (allowed $allowed, target 0)"
          if [ "$count" -gt "$allowed" ]; then
            echo "::error::a new direct spawn crossed the layer — $count sites, allowed $allowed."
            echo "Every process call belongs behind a port. The sites:"
            printf '%s\n' "$hits"
            exit 1
          fi
          if [ "$count" -lt "$allowed" ]; then
            echo "::notice::the ratchet can tighten — $count sites, allowed still $allowed."
          fi

      # PLOT'S OWN SCRIPTS, AND THIS ONE IS A REFUSAL RATHER THAN A RATCHET.
      #
      # The ratchet above counts every process the board starts and walks the
      # number down, because 54 tools reached through four contracts cannot be
      # fixed at once. `plot-*.sh` is the population that CAN be finished in one
      # branch and was — so it gets the gate its `Done when` asks for, at zero,
      # and a new invocation fails the build rather than raising a budget.
      #
      # The exit-code contract is why this population is different. Plot's
      # scripts answer `4` for *this host cannot be asked at all* and `1` or `3`
      # for *this attempt failed*, and a second reading of that difference turns
      # a permanent configuration fact into a transient incident — a caller then
      # retries something that will never work. `runScript()` maps it once.
      #
      # A NAME IS NOT AN INVOCATION. The board still holds eight `const`s
      # carrying filenames, handed to the port to run — so the gate matches a
      # `plot-*.sh` that appears in an ARGUMENT LIST or a path join, which is
      # what a caller building a command does, and not a bare string constant.
      #
      # IT IS SCOPED TO PLOT'S OWN SCRIPTS AND NOT TO `bash` AT ALL. The board
      # still runs `bash -c` over a git program in `registry.ts` — a different
      # tool through a different contract, with no exit-code mapping to collapse
      # — and that belongs to the slice beside this one. A gate that failed on it
      # would be asserting something this branch did not do.
      - name: One place reaches a script
        run: |
          hits=$(grep -rEn "(execFile|execFileSync|spawn|spawnSync)\([^)]*plot-[a-z-]+\.sh|(join|resolve)\([^)]*'plot-[a-z-]+\.sh'" \
                   --include='*.ts' packages/board/src || true)
          count=$(printf '%s' "$hits" | grep -c . || true)
          if [ "$count" -gt 0 ]; then
            echo "::error::the board invoked a script directly — $count sites, allowed 0."
            echo "Every plot-*.sh call belongs behind the Scripts port, which maps"
            echo "the exit codes once: 0 -> ok, 1|3 -> failed, 4 -> unaskable."
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "One place reaches a script: clean."

      # ONE ANSWER TO "DID THIS LAND", AND IT IS THE HOST'S.
      #
      # `plot-pr-merged.sh` reads `mergedAt` — never `state`, never ancestry.
      # Measured 2026-09-04 on this estate: ten merged branches still carried a
      # remote ref, and `git merge-base --is-ancestor` disagreed with the host on
      # TEN OF TEN. Squash-merge does not make ancestry occasionally wrong here;
      # the squashed commit is not the branch's commit, so it is wrong every
      # time. A caller that derives its own merge state hides finished work.
      #
      # THE GATE BANS THE DECISION, NOT THE CALL, and that is the whole
      # difficulty. Two ancestry callers here are correct: `plot-merge-queue.sh`
      # skips a branch already in main before predicting a conflict, and
      # `refs-git.ts` answers `unknown` when it cannot tell. Neither asks *did
      # this land* — they ask *can I skip this cheaply*, where a wrong answer
      # costs extra work rather than hiding finished work. A gate on every
      # `--is-ancestor` would ban `refs-git.ts`'s own documented `unknown`, which
      # is the honesty this rule asks for everywhere else.
      #
      # No line-oriented match separates them, because the difference is what the
      # answer flows INTO. So the gate requires each site to DECLARE which it is,
      # beside the call, and refuses one that declares nothing. The question
      # "did I complete this?" cannot be answered without the marker being in the
      # diff — and the marker is a line a reviewer reads and can disagree with.
      #
      # Verified against the tree before this branch: it named
      # `plot-dispatch.sh:2228`, the defect, among seven undeclared sites.
      - name: One answer to did-this-land
        run: ./scripts/check-ancestry-decisions.sh

      # ONE PLACE TALKS TO THE HOST, and it is `plot-host.sh`. That sentence has
      # been in CLAUDE.md since the adapter was written, and on 2026-09-05 four
      # scripts held their own `gh` call anyway — a rule failing exactly as
      # CLAUDE.md predicts a rule will, so it is a gate now.
      #
      # A second caller does not merely duplicate. Each of those four asked
      # about GitHub and nothing else, so a Bitbucket checkout got a helper that
      # was absent rather than wrong: `plot-pr-state.sh` answered
      # `{"found": false}` about a plan whose PR was open. And the copies drift
      # — the adapter learned Bitbucket's DECLINED-is-CLOSED normalisation and
      # its rate-limit exit codes, and none of the four did.
      #
      # A path check with a named exception list, simpler than the ancestry gate
      # above it: there the violation is a DECISION no line can show, here the
      # line itself is the violation. Comments and advice text are excluded
      # deliberately — two scripts mention `gh` in prose only, and a gate
      # flagging them would be reverted on its first run.
      - name: One place talks to the host
        run: ./scripts/check-host-cli-callers.sh

      # A PLAN'S BRANCH SECTION IS `## Slices`. The parser reads all three
      # spellings and always will — a plan file may be a year old, and refusing
      # to read the old word would make Plot worse at its job. This gates what
      # Plot WRITES. Measured 2026-09-05: three plans authored under the story
      # that exists to fix this vocabulary all said `## Branches`.
      - name: Plan headings say Slices
        run: ./scripts/check-plan-headings.sh

      # A TEARDOWN DOES NOT FAIL A SUITE — the gate that keeps the conversion.
      #
      # A raw recursive `fs.rmSync` in a test teardown races whatever child the
      # fixture left running: it removes a tree a doomed `git` or board process
      # is still writing into, throws ENOTEMPTY, and `node --test` reports the
      # throw as the LAST TEST FAILING. Measured across three failures, the
      # named test had passed and the failing site was one teardown.
      #
      # `rmTree` (test/helpers.mjs) retries that specific, transient class and
      # nothing else. 157 sites were converted to it across #578 and #616; one
      # raw site landed afterwards, which is exactly the drift a gate exists to
      # catch — a conversion nothing enforces is undone one merge at a time.
      #
      # `force: true` DOES NOT COVER THIS. It suppresses the absence of
      # something expected; this failure is the presence of something
      # unexpected. The stray site carried `force: true` and still raced.
      #
      # MECHANICAL, NOT JUDGED. The population is "a file under
      # packages/board/test/ calling fs.rmSync with recursive" — a grep. Scoping
      # it to "teardowns that race a child" would need a reviewer's opinion per
      # site, which is a rule, not a gate.
      #
      # `-a` for the same reason the domain gates carry it: one NUL byte in a
      # fixture would make grep report "binary file matches" and hide the whole
      # file from the count.
      #
      # `allowed=1` is `rmTree`'s own implementation, the one call that must
      # stay raw. Same ratchet shape as above: `::error::` when the count rises,
      # `::notice::` when it can tighten. The target is 1, not 0.
      #
      # THE ONE SHAPE IT MISSES is a call split across lines, because grep reads
      # one line at a time. Measured 2026-09-01: that form occurs nowhere in
      # `packages/` — every `fs.rmSync` in the repo is written on one line. The
      # fix would be a parser, and a parser is a different kind of check than a
      # ratchet; the blind spot is recorded here so the next reader knows it was
      # weighed rather than missed.
      #
      # A NON-recursive `fs.rmSync` is deliberately NOT in the population. It
      # removes one file, so it cannot race a child writing into a tree — 13
      # such calls stand in these tests and none is this bug. `git-retry.test.mjs`
      # also assigns to `fs.rmSync` to inject failures, which is the fixture
      # proving the retry works and must keep working.
      - name: A teardown does not race a child
        run: |
          allowed=1
          hits=$(grep -rEna 'fs\.rmSync\s*\([^)]*recursive' \
                   packages/board/test || true)
          count=$(printf '%s' "$hits" | grep -c . || true)
          echo "raw recursive fs.rmSync under packages/board/test: $count (allowed $allowed)"
          if [ "$count" -gt "$allowed" ]; then
            echo "::error::a raw recursive fs.rmSync reappeared in a test — $count sites, allowed $allowed."
            echo "Use rmTree() from test/helpers.mjs: it retries ENOTEMPTY/EBUSY/EPERM,"
            echo "which is what a teardown racing a still-running child throws."
            printf '%s\n' "$hits"
            exit 1
          fi
          if [ "$count" -lt "$allowed" ]; then
            echo "::notice::the ratchet can tighten — $count sites, allowed still $allowed."
          fi

      # TWO-SIDED, BECAUSE ONE SIDE PASSES ON NOTHING.
      #
      # "Every ports/*.ts has a directory under adapters/" is a universal claim,
      # and a universal claim over an empty set is true. Measured 2026-08-30:
      # there was no ports/ directory at all, so that assertion alone would have
      # reported success before a line was written — a check you can answer
      # "yes" to without doing the work is a rule, not a gate.
      #
      # So it also asserts a FLOOR. Seven is the port count DESIGN-ports.md §2
      # derives from the four sources of state; a port removed is a design
      # change that should have to edit this number.
      - name: Domain port completeness gate
        run: |
          ports=$(ls packages/domain/src/ports/*.ts 2>/dev/null | wc -l | tr -d ' ')
          if [ "$ports" -lt 7 ]; then
            echo "::error::expected at least 7 ports, found $ports."
            echo "The seven are PlanStore, Refs, Host, Processes, Trees, Clock, Machine —"
            echo "one per source of truth the domain may not look at. See DESIGN-ports.md."
            exit 1
          fi
          missing=""
          for port in packages/domain/src/ports/*.ts; do
            name=$(basename "$port" .ts)
            [ -d "packages/domain/src/adapters/$name" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::a port was declared and never implemented:$missing"
            echo "Every ports/<name>.ts needs a directory adapters/<name>/."
            exit 1
          fi
          echo "Domain port completeness gate: $ports ports, each with an adapter."

      # THE SPEC'S VOCABULARY, ENFORCED. `DESIGN-slice.md` renamed this entity
      # Slice on 2026-08-28: a Slice holds one branch and belongs to one plan,
      # while a Wave is the fleet's cross-plan cohort and is persisted nowhere.
      # The entity is renamed: no identifier here is named Wave. What remains is
      # the wire-compatibility path — `plot-fleet-scan.sh` still emits `waves`,
      # and the scan is a separate process that ships separately — plus the
      # comment that reserves the name for the cohort entity when the fleet
      # learns to form one.
      #
      # THE SPEC'S VOCABULARY, ENFORCED — and scoped to the MISUSE, not the word.
      #
      # `DESIGN-slice.md` renamed the per-plan entity **Slice** on 2026-08-28. It
      # also kept **Wave** as a real entity: the fleet's cross-plan cohort,
      # assembled at dispatch and persisted nowhere. So `Wave` is not a banned
      # word — it is a word with exactly one correct meaning.
      #
      # THE FIRST VERSION OF THIS GATE COUNTED EVERY `wave` AND WAS WRONG.
      # Measured 2026-08-29: a worker building the ten specified entities needed
      # to add the real `Wave`, which would have taken the count from 34 to 42
      # and failed the build. It renamed the entity to `Cohort` to get past the
      # gate — a word that appears NOWHERE in the spec. The gate had made the
      # correct name the expensive one, which is how a gate teaches evasion.
      #
      # So it counts the MISUSE: `Wave` bound to a per-plan shape — the
      # identifiers the rename plan removes — and ignores prose and the
      # standalone `Wave` entity.
      - name: Domain vocabulary gate
        run: |
          allowed=10  # 2026-08-29: the entity rename took it 12 -> 10; the target is 0
          # A QUOTED WIRE KEY IS NOT A MISUSE. `plot-plan-meta.sh` and
          # `plot-fleet-scan.sh` ship separately from this package and still
          # emit `waves`, so an adapter reading them must name that key once —
          # and the name belongs to the FOREIGN process, not to any shape here.
          # Excluded by the quoting, so `'waves'` passes and a bare `waves`
          # identifier does not. Without this the gate makes reading the estate
          # the expensive act, which is the evasion its own history warns about:
          # a worker met by it renamed the correct entity to `Cohort` to get past.
          #
          # FILTERED ON THE LINE, NOT THE MATCHED WORD — the lesson the actor-name
          # gate below already records. `grep -o` prints the word alone, which
          # discards the quotes that tell a wire key from an identifier.
          found=$(grep -rnaE "FleetWave|WaveVerdict|\bwaves\b" packages/domain/src/ \
                  | grep -vE "=\s*'waves'" | wc -l | tr -d ' ')
          if [ "$found" -gt "$allowed" ]; then
            echo "::error::the domain gained $((found - allowed)) misuse(s) of Wave ($found > $allowed)."
            echo "A Slice holds one branch and belongs to one plan. A Wave is the fleet's"
            echo "cross-plan cohort — that entity keeps the name. See DESIGN-slice.md."
            grep -rnaE "FleetWave|WaveVerdict|\bwaves\b" packages/domain/src/ \
              | grep -vE "=\s*'waves'" | head -40
            exit 1
          fi
          echo "Domain vocabulary gate: $found misuse(s), none added."

      # THE ACTOR IS AN AGENT, and "worker" is only how a process sees it.
      # `DESIGN-agent.md`: *"A 'worker' is not a separate thing an Agent has —
      # it is the Agent, observed through the process table."* Specialised
      # agents that are not loop-workers must stay expressible, so the actor
      # keeps one name.
      #
      # SCOPED TO THE MISUSE, learned from the vocabulary gate above: its first
      # version counted a whole word, made the SPEC'S OWN name the expensive
      # one, and taught a worker to invent `Cohort` to get past it. So this
      # allows the two process-level names the spec keeps — `WorkerState*` (six
      # process-table observations plus two task states) and `WorkerActivity*`
      # (a CPU cue) — plus the `Worker command` / `Worker bound` config keys,
      # and refuses `Worker` as a name for the actor.
      #
      # `WorkerMonitor` JOINS THE ALLOWLIST, and it is the same rule rather than
      # an exception to it. `entities/finding.ts` names three monitors by their
      # SUBJECT — `WorkerMonitor` the process every ~30 s, `AgentMonitor` the
      # desk every ~5 min, `BuildMonitor` the run — which is precisely the split
      # CLAUDE.md draws. A monitor of the process is Machine-side vocabulary and
      # is correctly named for it; renaming it would destroy the distinction its
      # sibling `AgentMonitor` exists to make.
      #
      # It is added here only because the `-a` fix below made these four lines
      # VISIBLE for the first time. They were always present and always correct;
      # the gate simply could not read the file they live in.
      - name: Domain actor-name gate
        run: |
          # Filter on the LINE, not on the matched word: `grep -o` discards the
          # context that tells `Worker command` apart from a bare `Worker`.
          hits=$(grep -rnaE "\bWorker[A-Za-z]*" packages/domain/src/ \
                 | grep -vE "WorkerState|WorkerActivity|WorkerMonitor" \
                 | grep -vE "\`?Worker (command|bound)\`?" || true)
          if [ -n "$hits" ]; then
            echo "::error::the actor is an Agent — 'Worker' names the process, never the actor:"
            echo "$hits"
            echo "Allowed: WorkerState*, WorkerActivity*, and the Worker command/bound config keys."
            exit 1
          fi
          echo "Domain actor-name gate: clean."

      # EVERY GATE ABOVE MUST BE ABLE TO READ EVERY FILE, and one NUL byte is
      # enough to stop it. `grep` classifies a file holding a NUL as binary and
      # prints "binary file matches" INSTEAD OF the matching lines, so a gate
      # that tests `[ -n "$hits" ]` sees an empty variable and passes.
      #
      # Measured 2026-09-01 on PR #610. `entities/finding.ts` builds a composite
      # key as `${f.monitor}\0${f.branch}` — a deliberate, correct separator,
      # since a NUL cannot occur in either half. The actor-name gate failed the
      # branch on two lines in `sample.ts` while FOUR `WorkerMonitor` hits in
      # `finding.ts`, one of them inside a `z.enum`, went unreported. The gate
      # was not wrong about the file; it could not see it.
      #
      # The stakes are highest for the purity gate: a domain file with a NUL
      # could import `child_process` invisibly, which is the one thing that gate
      # exists to prevent.
      #
      # `-a` is the fix, and this step is the gate on the fix. A recursive grep
      # over the domain that lacks it is refused here, so the blind spot cannot
      # come back by someone adding a sixth gate in the old shape.
      - name: Gate greps read every file
        run: |
          blind=$(grep -nE "grep -r[a-zA-Z]*" .github/workflows/ci.yml \
                  | grep -E "packages/domain/src|@plot-pm/domain" \
                  | grep -vE "grep -r[a-zA-Z]*a[a-zA-Z]*" || true)
          if [ -n "$blind" ]; then
            echo "::error::a domain gate greps without -a, so one NUL byte hides a whole file:"
            echo "$blind"
            echo "Add -a (--text) so grep reports matching lines rather than 'binary file matches'."
            exit 1
          fi
          echo "Gate greps read every file: clean."

      # ARROW FUNCTIONS, per CLAUDE.md > The Domain Package. The board's 507
      # `function` declarations are deliberately not the model — this rule is
      # for new code only, so it is scoped to this package.
      - name: Domain function-style gate
        run: |
          hits=$(grep -rnaE "^\s*(export )?function " packages/domain/src/ || true)
          if [ -n "$hits" ]; then
            echo "::error::the domain package uses arrow functions — 'export const f = (…) => …':"
            echo "$hits"
            exit 1
          fi
          echo "Domain function-style gate: clean."

      # WHAT THE MIGRATION LEAVES BEHIND IS A NAME, not a copy. When a rule moves
      # into the domain, production can keep compiling by aliasing the old name
      # to the new one — and then the move looks finished while the old seam is
      # still open. Measured 2026-08-30 on the sprint goal's own example:
      # `export { allSlicesMerged as allWavesMerged }` in `board.ts`, one line
      # carrying three callers. There was no second implementation; a grep for
      # duplicated CODE finds nothing here, which is exactly why this counts
      # names.
      #
      # THE SUBJECT IS THE RE-EXPORT, NOT ITS CALL SITES. Counting the three
      # callers would go red on a refactor that touched them without changing
      # the seam, and green if a fourth call joined an alias that should not
      # exist. One alias, one count, however many callers it has.
      #
      # `allowed` IS A LITERAL, for the reason the spawn ratchet above states:
      # deriving it from the estate makes the gate agree with whatever it finds.
      #
      # THE COUNT IS ALREADY 0, and that is a fact about timing rather than a
      # gate with nothing to do. `production-calls` removed the `allWavesMerged`
      # alias while this slice was being built — `board.ts` now re-exports
      # `allSlicesMerged` under its own name. So this gate never got to watch
      # that seam close; what it does is stop the next one opening, and the
      # migration still to come is exactly when that is likely.
      #
      # A ZERO A GATE CANNOT SEE IS WORTH NOTHING, so the counter was tested
      # against two aliases before this line was written: the historical
      # `allSlicesMerged as allWavesMerged`, and an invented
      # `approvable as planIsApprovable` in a multi-line block in the other
      # package. Both were caught, the three legitimate disambiguations beside
      # the second one still passed, and both were then removed.
      - name: Domain alias gate
        run: |
          allowed=0  # 2026-08-30: 0 at introduction; the alias it was written for is already gone
          out=$(./scripts/count-domain-aliases.sh)
          count=$(printf '%s' "$out" | sed -n 's/^count=//p')
          echo "domain names production still aliases: $count (allowed $allowed, target 0)"
          if [ "$count" -gt "$allowed" ]; then
            echo "::error::a domain name gained an alias — $count, allowed $allowed."
            echo "A moved rule kept its old name alive. Remove the alias and rename the callers;"
            echo "if the rename is forced by a real collision, both names are declared and this"
            echo "gate already ignores it. The aliases:"
            printf '%s\n' "$out" | grep -v '^count='
            exit 1
          fi
          echo "Domain alias gate: $count alias(es), none added."

      # A REPORT, AND IT FAILS ON NOTHING. Every neighbour of this step is a
      # gate; this one exits 0 whatever it reads, and the reason is that the
      # number cannot carry a threshold honestly.
      #
      # IT MEASURES FILE LAYOUT, NOT ADOPTION. Two ways a threshold would lie:
      # a refactor that MERGES two importing files lowers the count and improves
      # the code, and a file that IMPORTS WITHOUT CALLING raises it and proves
      # nothing. So there is no floor, no warning band, and no failure path —
      # any of those would make the number mean something it does not.
      #
      # ITS OWN STEP, DELIBERATELY NOT APPENDED TO THE ALIAS GATE ABOVE. A
      # report sharing a step with a gate teaches a reader that the number is
      # enforced, and the next person to watch it fall will go looking for the
      # regression that did not happen.
      #
      # WHAT IT IS FOR: a trend a human reads. The sprint moves rules out of
      # `packages/board/src/server/` and into the domain, and this is the one
      # line in the log that says how far that has got. It was 2 of 36 on
      # 2026-08-30, when the plan was written.
      #
      # COUNTED OVER THE WHOLE SUBTREE, not just its top level. That tree gained
      # `controllers/` and `entry/` after the baseline was taken, and a top-level
      # count would report a file moving into a subdirectory as adoption going
      # backwards — the same class of lie the threshold was rejected for.
      # `|| true` ON EVERY READ, and it is not defensive noise. `grep -l` exits 1
      # when it matches nothing, and GitHub runs each `run:` block under
      # `bash -e`. A zero count is the most interesting number this step can
      # print — a migration that has not started, or one whose files all moved —
      # and without these the step would FAIL on exactly that reading. That is
      # the "slightly a gate" trap the plan names, arrived at by accident rather
      # than by decision.
      #
      # The degenerate cases pass today only because a command substitution
      # masks the exit code and the last line happens to be a `sort`. Both are
      # facts about where a line sits, not about what the step promises, so the
      # promise is written down instead. Probed 2026-09-01: zero importers, and
      # the directory absent entirely, both exit 0.
      - name: Report — how far the board reaches the domain
        run: |
          tree=packages/board/src/server
          total=$(find "$tree" -name '*.ts' 2>/dev/null | wc -l | tr -d ' ' || true)
          reachers=$(grep -rla '@plot-pm/domain' "$tree" --include='*.ts' 2>/dev/null | sort || true)
          reaching=$(printf '%s' "$reachers" | grep -c . || true)
          echo "board server files importing @plot-pm/domain: $reaching of $total"
          echo "This is a REPORT, not a gate: it measures file layout, not adoption,"
          echo "so it has no threshold and never fails. Read it for trend."
          echo "Baseline 2 of 36, measured 2026-08-30, when the plan was written."
          echo "The files that reach it:"
          printf '%s\n' "$reachers"
          exit 0

      - name: Domain typecheck
        run: pnpm --filter @plot-pm/domain typecheck

      # A GATE, NOT A REPORT: `thresholds` makes this exit non-zero below 100%.
      # Defensible in this package and nowhere else here — the purity boundary
      # guarantees every line is reachable from a plain function call, so an
      # uncovered line is a line nobody specified.
      - name: Domain tests + coverage gate
        timeout-minutes: 10
        run: pnpm --filter @plot-pm/domain exec vitest run --coverage

      # ── Board (first-class): the Definition of Done requires the board to keep
      #    working. Typecheck, tests, and a fresh build are gated here. ──────────
      - name: Board typecheck
        run: pnpm run typecheck

      - name: Board build + artifact freshness
        timeout-minutes: 10
        run: |
          pnpm run build:board
          if ! git diff --quiet -- skills/plot/scripts/board/board-server.mjs; then
            echo "::error::skills/plot/scripts/board/board-server.mjs is stale — run 'pnpm build:board' and commit the result."
            git --no-pager diff --stat -- skills/plot/scripts/board/board-server.mjs
            exit 1
          fi
          echo "Board artifact is fresh."

      # BOUNDED BECAUSE IT SPAWNS. This runs the board's `node --test` suites,
      # which start real `board-server.mjs` processes — the population that hung
      # locally on 2026-08-31 (two runs asleep at 0% CPU for 33 and 47 minutes,
      # holding an orphaned server). A step that spawns can hang; a grep cannot,
      # which is why the gates below carry no bound and this does.
      - name: Board tests
        timeout-minutes: 10
        run: pnpm --filter @plot-pm/board test

      # ── Board integration tests: a real browser (Playwright) renders the just-
      #    built artifact against the tiny-garden fixture, asserting the mobile
      #    no-horizontal-scroll fix and the inline-sprint filter. ───────────────
      # THE STEP THAT HUNG ELEVEN TIMES IN ONE DAY, and neither half of this is
      # optional. The cache usually removes the download entirely; the timeout
      # decides what happens on the days it does not.
      #
      # Keyed on the resolved Playwright version rather than on the lockfile
      # hash: the browser build is chosen by that version and by nothing else,
      # so a lockfile change elsewhere must not evict a browser that is still
      # correct. `restore-keys` lets a near-miss serve the OS deps while the
      # exact browser is fetched.
      - name: Cache the Playwright browser
        timeout-minutes: 10
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/board/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # THREE MINUTES, against a step that takes ~45 s warm and ~90 s cold.
      # This is deliberately tight: the failure mode is not a slow CDN, it is a
      # connection that never completes, and every measured hang sat past 10
      # minutes with no output. A tight bound turns that into a fast, re-runnable
      # failure instead of an hour of silence — the difference between a gate and
      # a thing somebody has to watch.
      - name: Install Playwright browser
        timeout-minutes: 3
        run: pnpm --filter @plot-pm/board exec playwright install --with-deps chromium

      # The longest legitimate step — a real browser against the built artifact.
      # Measured green at 4 to 8 minutes; 15 covers a saturated runner without
      # letting a wedged browser hold the job to the ceiling above.
      - name: Board integration tests (vitest + Playwright)
        timeout-minutes: 15
        run: pnpm --filter @plot-pm/board exec vitest run

      # NOT gated on pull_request: an unknown package name aborts `changeset
      # version` for the WHOLE repo, so it must fail on main too — the four-day
      # silent freeze of the v2.9.0 release PR is what this exists to prevent,
      # and that PR was never itself a pull_request event on these files.
      - name: Changesets name real workspace packages
        run: ./scripts/check-changeset-packages.sh

      - name: Check for changeset
        if: github.event_name == 'pull_request'
        run: |
          # Find pending changeset files (not README.md or _template)
          changeset_files=$(find .changeset -name '*.md' -not -name 'README.md' -not -name '_template' 2>/dev/null || true)

          if [ -z "$changeset_files" ]; then
            echo "::warning::No changeset found. If this PR changes skills, run 'pnpm changeset' to add one."
            exit 0
          fi

          echo "Found changesets:"
          echo "$changeset_files"

          # Validate that bumps: block references existing skill directories
          echo "$changeset_files" | while IFS= read -r f; do
            [ -z "$f" ] && continue

            # Extract skill names from <!-- bumps: skills: skill-name: bump --> block
            awk '/^<!--/{c=1;next}/^-->/{c=0;next}c' "$f" | \
              awk '/skills:/{s=1;next} /^[[:space:]]{0,2}[a-z]/{s=0} s && /[a-z]/' | \
              sed 's/^[[:space:]]*//;s/[[:space:]]*:.*//' | \
            while IFS= read -r skill; do
              [ -z "$skill" ] && continue
              if [ ! -d "skills/$skill" ]; then
                echo "::error file=$f::bumps block references non-existent skill directory: '$skill'"
                exit 1
              fi
            done
          done

          echo "All changeset bumps references are valid."
