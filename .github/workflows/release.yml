name: Release

# Single publishing workflow. npm Trusted Publishing (OIDC) allows exactly ONE
# workflow filename per package, so BOTH publish paths live in THIS file:
#   • push to main       → `release` job — changesets opens/updates the version
#                          PR, or (on a changeset-free push) tags + creates the
#                          GitHub Release + publishes the STABLE board to npm.
#   • push of v*-rc.*    → `board-release-candidate` job — publishes
#                          @plot-pm/board at the next X.Y.Z-rc.N to the npm `rc`
#                          dist-tag. `/plot-release rc` writes that tag.
#
# The tag is the trigger because a release candidate is a build a person
# nominates for verification. The predecessor job ran on every push to main
# under the condition "a board changeset is pending" — repository state that
# holds for days — and so republished unchanged code once per push: 709
# prereleases against 7 stable releases, 27 of 31 in the 0.8.0 series carrying
# unchanged board code (measured 2026-08-26). See
# docs/plans/2026-08-26-release-candidate-publishing.md.
#
# Auth is TOKENLESS: OIDC trusted publishing (npm >= 11.5.1, Node >= 22.14,
# id-token: write, --provenance). No NPM_TOKEN anywhere. Register the trusted
# publisher on npmjs.com for @plot-pm/board as:
#   GitHub Actions · plot-pm/plot · workflow: release.yml · (no environment)
# and set "Require two-factor authentication and disallow tokens".

on:
  push:
    branches: [main]
    tags: ['v*-rc.*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # `github.event_name` is `push` for TAG pushes too, so the branch test is
    # load-bearing: without it a v*-rc.* tag would run changesets/action against
    # a tag ref, where it may open a version PR or publish a stable release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Read by `dispatch-ci`, which starts CI on the release branch.
    outputs:
      pr_number: ${{ steps.changesets.outputs.pullRequestNumber }}
      head_sha: ${{ steps.release-head.outputs.head_sha }}
    # UNCHANGED, and deliberately without `actions: write`. This job runs
    # `changesets/action`, `pnpm install` and `create-release.sh` and publishes
    # to npm; widening it was the rejected alternative. The dispatch holds that
    # permission in its own job instead.
    permissions:
      contents: write
      pull-requests: write
      id-token: write # OIDC: tokenless npm publish (stable board) with provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # OIDC trusted publishing requires Node >= 22.14
          cache: pnpm
          # Points npm at the public registry; with no NODE_AUTH_TOKEN set, npm
          # >= 11.5.1 authenticates the publish via OIDC (trusted publishing).
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Pin npm for OIDC trusted publishing
        # Node 24 bundles an older npm; trusted publishing needs npm >= 11.5.1.
        # Echo the resolved versions so an auth failure at publish time is easy
        # to triage (version mismatch vs. trusted-publisher config).
        run: |
          npm install -g npm@11.12.1
          node --version
          npm --version

      - name: Compute next release version
        id: nextver
        run: |
          # Predict the next package version from pending changesets so the
          # release PR title and commit message can include the actual version
          # (e.g. "release: 1.1.0") instead of a generic "chore: release".
          #
          # `changeset status` exits 1 in TWO cases: nothing is pending, and a
          # changeset names a package outside the workspace. The exit status does
          # not distinguish them (measured 2026-08-26, @changesets/cli 2.30.0), so
          # the message decides. The predecessor `|| echo '{"releases":[]}'`
          # reported the second case as the first: six bad changesets held the
          # v2.9.0 release at 8 of 98 for four days while the job stayed green.
          if out=$(npx changeset status --output=/tmp/changeset-status.json 2>&1); then
            NEXT=$(jq -r '.releases[] | select(.name=="plot") | .newVersion' \
              /tmp/changeset-status.json | head -n1)
          elif printf '%s' "$out" | grep -q 'no changesets were found'; then
            NEXT=""   # nothing pending — the changeset-free push path
          else
            echo "::error::changeset status failed"
            printf '%s\n' "$out"
            exit 1
          fi
          NEXT="${NEXT:-pending}"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT"

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run version
          publish: bash .dev/scripts/create-release.sh
          commit: "release: ${{ steps.nextver.outputs.version }}"
          title: "release: ${{ steps.nextver.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the release branch head
        id: release-head
        if: steps.changesets.outputs.pullRequestNumber
        run: |
          set -euo pipefail
          # THE LOCAL REF, which `changesets/action` committed and pushed in the
          # step above. It is never read from the remote, because the remote is
          # the ref the guard distrusts: `changeset-release/main` carries no
          # branch protection and no ruleset (404 on 2026-10-01), so any writer
          # can push between that force-push and the dispatch, and reading the
          # remote would pin the run to whatever they wrote.
          #
          # AN ABSENT LOCAL REF FAILS. A release PR exists at this point, so the
          # branch does too; a missing ref means the assumption broke and the
          # dispatch would otherwise go out unpinned.
          HEAD_SHA=$(git rev-parse --verify refs/heads/changeset-release/main)
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Release branch head: $HEAD_SHA"

      - name: Assign release PR
        if: steps.changesets.outputs.pullRequestNumber
        env:
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr edit "$PR_NUMBER" --add-assignee eins78

  # ── Start CI on the release PR, because nothing else does ─────────────────
  #
  # `validate` is a required check on `main` and had never once reported on the
  # release PR. The pull request run is held at `action_required` because the PR
  # is bot-authored, and a push run does not exist at all: the push above is made
  # with `secrets.GITHUB_TOKEN`, and GitHub starts no workflow from an event that
  # token caused, except `workflow_dispatch` and `repository_dispatch`. Measured
  # 2026-10-01 through the Actions API: 0 push runs on that branch, ever, and
  # v2.22.0, v2.22.1 and v2.22.2 each merged with `gh pr merge --admin`.
  #
  # ITS OWN JOB, AND THAT IS THE POINT. `actions: write` lives here and nowhere
  # else — the `release` job publishes to npm and runs `create-release.sh`, so
  # widening it was the rejected alternative. This job checks nothing out, adds
  # no action (`gh` is preinstalled on the runner, so every `uses:` in this file
  # stays SHA-pinned), and holds no credential but `GITHUB_TOKEN`.
  #
  # A FAILED DISPATCH FAILS THIS JOB AND SO THE RELEASE RUN. It is the only
  # signal that the release PR carries no check, so it is not a warning: no
  # `continue-on-error`, no `|| true`.
  dispatch-ci:
    needs: release
    if: ${{ needs.release.outputs.pr_number }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch CI on the release branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ needs.release.outputs.head_sha }}
          PR_NUMBER: ${{ needs.release.outputs.pr_number }}
        run: |
          set -euo pipefail
          # Printed BEFORE the call, so a run that reports on the wrong head is
          # diagnosable from this log rather than from the Actions API.
          echo "Dispatching CI for release PR #$PR_NUMBER at $HEAD_SHA"
          gh workflow run ci.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref changeset-release/main \
            -f expected_sha="$HEAD_SHA"

  board-release-candidate:
    # Publishes @plot-pm/board at the next X.Y.Z-rc.N to the npm `rc` dist-tag,
    # installable with `npm i @plot-pm/board@rc`.
    #
    # Triggered by the release-candidate TAG, which `/plot-release rc` writes
    # alongside a verification checklist. One publish per release candidate, and
    # the tag records who cut it.
    #
    # BASE is the changeset-PREDICTED next board version (the same
    # `changeset status` the release job uses), so the package is labelled for
    # the version it contains rather than the lagging
    # packages/board/package.json. No pending @plot-pm/board changeset means the
    # board has not changed since the last stable release, so a plugin-only
    # release publishes no package (exit 0).
    #
    # A base that never ships stable is EXPECTED, not a defect: a minor
    # changeset merged during verification moves the next stable elsewhere. The
    # candidate has already served its purpose.
    #
    # rc.N is the registry-derived counter (highest published <BASE>-rc.<n>
    # plus 1, first is rc.1 per plot-release/SKILL.md), which resets when BASE
    # bumps. Publishes only to the `rc` dist-tag and never re-points `latest` on
    # an existing package; the one exception is npm's first-ever-publish rule (a
    # package must always have a `latest`), which set `latest` at the manual
    # debut and self-heals when the first stable ships. Never commits.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: tokenless npm publish with provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # OIDC trusted publishing requires Node >= 22.14
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Pin npm for OIDC trusted publishing
        run: |
          npm install -g npm@11.12.1
          node --version
          npm --version

      - name: Publish the board release candidate to the npm `rc` tag
        run: |
          set -euo pipefail
          # The tag is the trigger, so the ref must be checked here: a tag cut on
          # a feature branch must not publish a package computed from that
          # branch's changesets. The predecessor job got this from
          # `github.ref == 'refs/heads/main'`, which a tag ref cannot express.
          # `main` is fetched explicitly — the checkout is a tag ref and carries
          # no branch.
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::release-candidate tag $GITHUB_REF_NAME is not on main"
            exit 1
          }

          # BASE = the changeset-PREDICTED next board version (same mechanism the
          # release job uses). This is intentionally the ONLY source of BASE (no
          # package.json fallback), so the package always matches the code it
          # contains.
          #
          # `changeset status` exits 1 for BOTH "nothing pending" and "a
          # changeset names a package outside the workspace" (measured
          # 2026-08-26, @changesets/cli 2.30.0). The message discriminates. The
          # predecessor `|| echo '{"releases":[]}'` reported the second as the
          # first, and board publishing stopped for three days while more than
          # 200 runs reported success.
          if out=$(npx changeset status --output=/tmp/cs.json 2>&1); then
            BASE=$(jq -r '.releases[] | select(.name=="@plot-pm/board") | .newVersion' /tmp/cs.json | head -n1)
          elif printf '%s' "$out" | grep -q 'no changesets were found'; then
            BASE=""
          else
            echo "::error::changeset status failed"
            printf '%s\n' "$out"
            exit 1
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "null" ]; then
            echo "board unchanged since the last stable release — no package to publish"
            exit 0
          fi
          BASE=${BASE%%-*} # strip any prerelease suffix -> clean X.Y.Z base
          # Next rc.N = (highest published <BASE>-rc.<n>) + 1, else 1.
          # First is rc.1, matching the convention plot-release/SKILL.md states;
          # the predecessor started at rc.0 and contradicted it.
          # The counter's state lives in the npm registry (the record of what is
          # published) — no changesets pre-mode, no repo-global state, board-only.
          # It resets naturally when BASE bumps to a version with no published rc.
          VERSIONS=$(npm view @plot-pm/board versions --json 2>/dev/null || echo '[]')
          N=$(printf '%s' "$VERSIONS" | jq -r --arg pre "${BASE}-rc." '
            (if type=="array" then . else [.] end)
            | map(select(startswith($pre)))
            | map(.[($pre|length):])
            | map(select(test("^[0-9]+$")))
            | map(tonumber)
            | (max // 0) + 1
          ')
          RC="${BASE}-rc.${N}"
          echo "Publishing @plot-pm/board@${RC} to the npm 'rc' tag"
          # Set the board version in place — no git tag/commit (runner is ephemeral).
          tmp=$(mktemp)
          jq --arg v "$RC" '.version=$v' packages/board/package.json > "$tmp"
          mv "$tmp" packages/board/package.json
          # prepack (packages/board) rebuilds the gitignored dist/ during publish.
          cd packages/board
          npm publish --provenance --tag rc --access public
          echo "Published @plot-pm/board@${RC} to the npm 'rc' tag."
