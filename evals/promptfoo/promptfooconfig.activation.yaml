description: "plot-2 activation: installed-but-not-invoked must not inject ceremony"
prompts:
  - file://prompts/activation.txt
providers:
  - id: openrouter:anthropic/claude-sonnet-5
    config: { temperature: 0, max_tokens: 400 }
  - id: openrouter:anthropic/claude-haiku-4.5
    config: { temperature: 0, max_tokens: 400 }
  - id: openrouter:openai/gpt-chat-latest
    config: { temperature: 0, max_tokens: 600 }
# gemini excluded: reasoning-exclude transform unreliable for prose output
# (documented in the laconic scoreboard) — one-line suites only.

defaultTest:
  options:
    provider: openrouter:anthropic/claude-sonnet-5
  vars:
    skill: file://../../skills/plot/SKILL.md
tests:
  - description: simple factual question -> no plot ceremony
    vars:
      scenario: "what does HTTP 304 mean?"
    assert:
      - { type: not-icontains, value: "/plot" }
      - { type: not-icontains, value: "plan file" }
  - description: tiny code request -> no plan/branch ceremony pushed
    vars:
      scenario: "rename the variable `usr` to `user` in utils.py please"
    assert:
      - { type: not-icontains, value: "/plot-idea" }
      - type: llm-rubric
        value: >-
          The response should simply help with (or do) the rename. It must
          NOT demand a plan, an idea branch, a PR, or any planning ceremony
          before helping. Mentioning nothing about planning passes.
